<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Spec Check</title>
  <desc id="desc">Know your parts. Check your specs. A datasheet research workspace for hardware engineers.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#557264" opacity=".35"/></pattern>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#142a23"/><stop offset="1" stop-color="#264b39"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9f5b6"/><stop offset="1" stop-color="#9fc57b"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <path d="M765 85h90l40 40h98M800 315h60l44-44h89M1130 90v50l-25 25M1155 315v-55l-50-30M840 200h140M1100 200h125" fill="none" stroke="#779c68" stroke-width="2" opacity=".5"/>
  <g fill="#b9dc91"><circle cx="765" cy="85" r="4"/><circle cx="800" cy="315" r="4"/><circle cx="1130" cy="90" r="4"/><circle cx="1155" cy="315" r="4"/><circle cx="840" cy="200" r="4"/><circle cx="1225" cy="200" r="4"/></g>
  <g transform="translate(926 118)">
    <g stroke="#a8c28f" stroke-width="9"><path d="M25 0v-17M57 0v-17M89 0v-17M121 0v-17M25 164v17M57 164v17M89 164v17M121 164v17M0 25h-17M0 57h-17M0 89h-17M0 121h-17M164 25h17M164 57h17M164 89h17M164 121h17"/></g>
    <rect width="164" height="164" rx="17" fill="url(#chip)"/>
    <rect x="10" y="10" width="144" height="144" rx="11" fill="none" stroke="#638352" opacity=".45"/>
    <path d="m48 82 24 24 48-52" fill="none" stroke="#244a34" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="139" r="4" fill="#5b7848"/>
  </g>
  <rect x="65" y="58" width="6" height="6" fill="#c0e99a"/>
  <text x="84" y="66" fill="#b9cdac" font-family="Consolas,monospace" font-size="12" letter-spacing="3">HARDWARE RESEARCH, SIMPLIFIED</text>
  <text x="60" y="159" fill="#f5f8ed" font-family="Segoe UI,Arial,sans-serif" font-size="77" font-weight="650" letter-spacing="-3">Spec Check<tspan fill="#c1eb99">.</tspan></text>
  <text x="65" y="212" fill="#c5e6ad" font-family="Segoe UI,Arial,sans-serif" font-size="27" letter-spacing="-.5">Know your parts. Check your specs.</text>
  <text x="66" y="256" fill="#a3b7a6" font-family="Segoe UI,Arial,sans-serif" font-size="17">Ask your datasheets. Compare components. Follow the evidence.</text>
  <g font-family="Consolas,monospace" font-size="11" letter-spacing="1.5">
    <rect x="65" y="305" width="126" height="31" rx="5" fill="#385741" stroke="#54734e"/><text x="81" y="325" fill="#d5e7c4">PDF → SPECS</text>
    <rect x="203" y="305" width="143" height="31" rx="5" fill="#385741" stroke="#54734e"/><text x="218" y="325" fill="#d5e7c4">PAGE CITATIONS</text>
    <rect x="358" y="305" width="126" height="31" rx="5" fill="#385741" stroke="#54734e"/><text x="375" y="325" fill="#d5e7c4">LOCAL FIRST</text>
    <text x="1114" y="365" fill="#829d7d">CSCE 289</text>
  </g>
</svg>
