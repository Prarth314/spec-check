[project]
name = "spec-check"
version = "0.1.0"
description = "Page-cited datasheet research for hardware teams"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "pdfplumber>=0.11,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "spec_check.app:app"
